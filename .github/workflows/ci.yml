name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  # Builds a tester release from the Actions tab without pushing a tag first; the release creates the tag.
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create, for example v1.0.0-beta.1
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: Exam rules schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install jsonschema==4.23.0
      - name: Validate bundled exam rules
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open('docs/exam-rules.schema.json'))
          rules = json.load(open('feature-exam/src/main/assets/exam_rules.json'))
          jsonschema.validate(rules, schema, format_checker=jsonschema.FormatChecker())
          print('exam_rules.json is valid:', len(rules['profiles']), 'profiles')
          PY

  check:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Static analysis (detekt + ktlint rules, zero findings allowed)
        run: ./gradlew detekt
      - name: Network isolation (offline modules must not resolve networking libraries)
        run: ./gradlew verifyNetworkIsolation
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :core-domain:test :core-office:test
      - name: Android Lint (warnings are errors)
        run: ./gradlew lintDebug --continue
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug
      - name: Merged manifest has no broad storage permissions and no ads
        run: |
          manifest=$(find app/build/intermediates/merged_manifest -name AndroidManifest.xml | head -n 1)
          test -n "$manifest"
          if grep -E 'READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE|READ_MEDIA_' "$manifest"; then
            echo "Broad storage permission found in merged manifest" >&2
            exit 1
          fi
          grep -q 'android:allowBackup="false"' "$manifest"
          # No ads SDK, no advertising ID: the app is free and ad-free.
          if grep -E 'permission.AD_ID|com.google.android.gms.ads' "$manifest"; then
            echo "Advertising component found in merged manifest" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: '**/build/reports/'

  instrumented:
    name: Compose UI tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The emulator needs about 7 GB for its userdata partition, and the Gradle build leaves the stock runner
      # with less than that, so drop preinstalled toolchains this job never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Only modules that ship instrumented tests get a test APK run. A bare connectedDebugAndroidTest also
      # installs empty test APKs for every library (they crash: no runner, or no AdMob app ID in :core-ads)
      # and runs :benchmark, whose macrobenchmarks need an installed release-like app on a real device.
      - name: Find modules with instrumented tests
        id: modules
        run: |
          tasks=$(for d in */src/androidTest; do printf ':%s:connectedDebugAndroidTest ' "${d%%/src/androidTest}"; done)
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          script: ./gradlew ${{ steps.modules.outputs.tasks }}

  release:
    name: Release bundle
    runs-on: ubuntu-latest
    needs: [rules, check]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The Play Store bundle needs an upload keystore. Signing is optional: until the MFF_KEYSTORE_* secrets
      # exist the job skips the bundle instead of failing, and the tag still ships the tester APK below.
      - name: Check release secrets
        id: secrets
        env:
          KEYSTORE_B64: ${{ secrets.MFF_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No upload keystore is configured, so no Play Store bundle was built."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode keystore
        if: steps.secrets.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.MFF_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build release bundle
        if: steps.secrets.outputs.configured == 'true'
        env:
          MFF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MFF_KEYSTORE_PASSWORD: ${{ secrets.MFF_KEYSTORE_PASSWORD }}
          MFF_KEY_ALIAS: ${{ secrets.MFF_KEY_ALIAS }}
          MFF_KEY_PASSWORD: ${{ secrets.MFF_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          name: app-release-bundle
          path: app/build/outputs/bundle/release/*.aab

  tester-apk:
    name: Tester APK on the GitHub release
    runs-on: ubuntu-latest
    needs: [rules, check]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # A debug build: debug-signed so it installs by sideloading, and installs as
      # com.mrfilefixit.app.debug next to any Play Store copy. No ads, no account, everything free.
      - run: ./gradlew :app:assembleDebug
      - name: Publish pre-release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "::error::Version must look like v1.2.3, got '$TAG'"; exit 1 ;; esac
          apk="MrFileFixit-${TAG}-tester.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$TAG" "$apk" --target "$GITHUB_SHA" --prerelease --title "Mr File Fixit $TAG (tester build)" \
            --notes "Tester build for sideloading. Free, offline, no ads and no sign-in. It is debug-signed, so it is not the Play Store upload."
